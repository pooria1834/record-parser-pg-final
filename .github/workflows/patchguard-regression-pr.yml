# Install this workflow on the NEW repository main branch.
# Replace all ce52a5cb6da7166563191e40c533032878643e28 tokens with ONE published PatchGuard commit SHA.
name: PatchGuard regression PR

on:
  workflow_run:
    workflows: ["PatchGuard"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    # Forks and push/dispatch runs do not get a publishing workflow. This job
    # also runs when the triggering PatchGuard job FAILED (exit 10/20/etc.).
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number > 0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PATCHGUARD_WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Checkout trusted main (no credentials persisted)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PatchGuard tooling
        uses: actions/checkout@v4
        with:
          repository: pooria1834/PatchGuard
          ref: ce52a5cb6da7166563191e40c533032878643e28
          path: .patchguard-tool
          persist-credentials: false

      - name: Set up trusted host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install trusted YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Move trusted tooling outside the untrusted Docker workspace
        shell: bash
        run: |
          mv .patchguard-tool "$RUNNER_TEMP/patchguard-tool"

      - name: Download the completed PR run evidence
        uses: actions/download-artifact@v4
        with:
          name: patchguard-pr-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/raw-pr-evidence

      - name: Copy only the named evidence files into the unprivileged workspace
        shell: bash
        run: |
          mkdir -p artifacts/patchguard
          cp "$RUNNER_TEMP/raw-pr-evidence/report.json" artifacts/patchguard/report.json
          cp "$RUNNER_TEMP/raw-pr-evidence/technical-evidence.zip" artifacts/patchguard/technical-evidence.zip

      - name: Verify exact Git source revisions and hashes
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 "$RUNNER_TEMP/patchguard-tool/scripts/workflow_run_sources.py" \
            --config .patchguard/config.yaml \
            --archive artifacts/patchguard/technical-evidence.zip \
            --pr-number "$PR_NUMBER" --expected-head-sha "$HEAD_SHA"

      - name: Reproduce witnesses with no network or write token
        shell: bash
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/patchguard-verification"
          mkdir -p "$VERIFY/artifacts/patchguard" "$VERIFY/reviewed" tests/regression/reviewed
          cp artifacts/patchguard/report.json artifacts/patchguard/technical-evidence.zip \
            "$VERIFY/artifacts/patchguard/"
          docker build -q -t patchguard-verification "$RUNNER_TEMP/patchguard-tool"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g --memory-swap 2g \
            --cpus 2 --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,noexec,size=256m \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PATCHGUARD_WORKSPACE=/work -e PYTHONPATH=/tool \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work,readonly" \
            --mount "type=bind,source=$VERIFY/artifacts,target=/work/artifacts" \
            --mount "type=bind,source=$VERIFY/reviewed,target=/work/tests/regression/reviewed" \
            --mount "type=bind,source=$RUNNER_TEMP/patchguard-tool,target=/tool,readonly" \
            -w /work patchguard-verification \
            python3 /tool/scripts/batch_promote.py \
            --config .patchguard/config.yaml --report-dir artifacts/patchguard --verify-witness

      - name: Export canonical, verified fixtures as data only
        shell: bash
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 "$RUNNER_TEMP/patchguard-tool/scripts/export_verified_regressions.py" \
            --config .patchguard/config.yaml \
            --archive artifacts/patchguard/technical-evidence.zip \
            --plan "$RUNNER_TEMP/patchguard-verification/artifacts/patchguard/regression-pr-preparation.json" \
            --out "$RUNNER_TEMP/verified-handoff" \
            --run-id "$SOURCE_RUN" --run-attempt "$SOURCE_ATTEMPT"

      - name: Upload verified regression data for privileged publisher
        uses: actions/upload-artifact@v4
        with:
          name: patchguard-verified-regressions
          path: ${{ runner.temp }}/verified-handoff/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCHGUARD_WORKSPACE: ${{ github.workspace }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PatchGuard tooling
        uses: actions/checkout@v4
        with:
          repository: pooria1834/PatchGuard
          ref: ce52a5cb6da7166563191e40c533032878643e28
          path: .patchguard-tool
          persist-credentials: false

      - name: Set up trusted host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install trusted YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Download verified DATA from the previous job
        uses: actions/download-artifact@v4
        with:
          name: patchguard-verified-regressions
          path: ${{ runner.temp }}/verified-handoff

      - name: Import only canonical verified fixtures (no target code execution)
        shell: bash
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 .patchguard-tool/scripts/import_verified_regressions.py \
            --config .patchguard/config.yaml \
            --handoff "$RUNNER_TEMP/verified-handoff" \
            --report-dir artifacts/patchguard \
            --source-run-id "$SOURCE_RUN" --source-run-attempt "$SOURCE_ATTEMPT"

      - name: Open a single DRAFT PR against main
        shell: bash
        env:
          PG_DEFAULT_BRANCH: main
          PG_GITHUB_TOKEN: ${{ github.token }}
          PG_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PG_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 .patchguard-tool/scripts/create_regression_pr.py \
            --report-dir artifacts/patchguard
